# Builds Vidsource and publishes a GitHub Release when a v* tag is pushed.
# Also runnable manually via workflow_dispatch (build only).
name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Keeps the APK signature stable across releases (cache), or uses the
      # VIDSOURCE_KEYSTORE_BASE64 repo secret when configured (recommended).
      - name: Restore signing keystore cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vidsource-release.p12
          key: vidsource-release-keystore-v1

      - name: Prepare signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.VIDSOURCE_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.VIDSOURCE_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "Using repository signing keystore (VIDSOURCE_KEYSTORE_BASE64)"
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/vidsource-release.p12"
          else
            echo "::warning::No VIDSOURCE_KEYSTORE_BASE64 secret set. Using/generating a cached keystore — set the secret to keep APK signatures stable forever (see README)."
            if [ -f "$RUNNER_TEMP/vidsource-release.p12" ]; then
              echo "Using cached signing keystore"
            else
              echo "Generating a new signing keystore"
              keytool -genkeypair \
                -keystore "$RUNNER_TEMP/vidsource-release.p12" \
                -storetype pkcs12 \
                -alias vidsource \
                -keyalg RSA -keysize 2048 -validity 10950 \
                -storepass vidsource -keypass vidsource \
                -dname "CN=Vidsource, O=Vidsource"
            fi
          fi
          {
            echo "VIDSOURCE_KEYSTORE_FILE=$RUNNER_TEMP/vidsource-release.p12"
            echo "VIDSOURCE_KEYSTORE_PASSWORD=${KEYSTORE_PASS:-vidsource}"
            echo "VIDSOURCE_KEY_ALIAS=vidsource"
            echo "VIDSOURCE_KEY_PASSWORD=${KEYSTORE_PASS:-vidsource}"
          } >> "$GITHUB_ENV"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug & release APKs
        run: |
          set -o pipefail
          if ./gradlew :app:assembleDebug :app:assembleRelease --console=plain --stacktrace 2>&1 | tee build.log; then
            echo "Build succeeded"
          else
            {
              echo "## Gradle build failed"
              echo '```'
              grep -E "^e: |error: |FAILURE:|What went wrong|Execution failed|Caused by:" build.log | grep -v "^> Task" | head -60
              echo "---- detail lines ----"
              grep "^> " build.log | grep -v "^> Task" | head -25
              echo "---- tail ----"
              tail -25 build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Gradle build failed — see annotations below and the job summary"
            {
              grep -E "^e: |error: |FAILURE:|Execution failed|Caused by:" build.log | head -15
              grep "^> " build.log | grep -v "^> Task" | head -8
            } | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi

      - name: Package artifacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then VERSION="1.0.0-dev"; fi
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Vidsource-$VERSION.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Vidsource-$VERSION-debug.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -la dist
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vidsource-apks
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: vidsource-apks
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: Vidsource ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
          body: |
            ## Vidsource ${{ github.ref_name }} 🎞️

            Android TV & mobile video source browser with a native player.

            ### Downloads
            | File | Use |
            | --- | --- |
            | `Vidsource-*.apk` | Signed release build — **install this** |
            | `Vidsource-*-debug.apk` | Debug-signed build |
            | `SHA256SUMS.txt` | Checksums |

            ### Highlights
            - Add website sources manually and switch between them like TV channels (favicon profile strip)
            - Native player: double-tap left/right to seek ±10s; D-pad ◀/▶ on TCL remotes
            - Android TV layout with D-pad web pointer, CH+/CH− channel zapping
            - Demo source: https://cinejoy.pk/

            Sideload via `adb install Vidsource-*.apk` or a USB stick + file manager on your TV.
